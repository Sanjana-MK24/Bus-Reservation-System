<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .payment-card {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }

    .payment-card h1 {
      margin-bottom: 30px;
      color: #007BFF;
    }

    .payment-card p {
      margin: 12px 0;
      font-size: 1.1em;
    }

    .payment-card form {
      margin-top: 30px;
      text-align: left;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1em;
    }

    .payment-card button {
      background: #28a745;
      color: #fff;
      border: none;
      padding: 15px 40px;
      font-size: 1em;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s, transform 0.2s;
    }

    .payment-card button:hover {
      background: #218838;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="payment-card">
    <h1>Payment</h1>
    <p><strong>Bus No:</strong> {{ bus_no }}</p>
    <p><strong>From:</strong> {{ source.capitalize() }}</p>
    <p><strong>To:</strong> {{ destination.capitalize() }}</p>
    <p><strong>Name:</strong> {{ name }}</p>
    <p><strong>Seat:</strong> {{ seat_no }}</p>
    <p><strong>Amount to Pay:</strong> ₹{{ amount }}</p>

    <form method="POST" action="{{ url_for('payment') }}">
      <input type="hidden" name="bus_no" value="{{ bus_no }}">
      <input type="hidden" name="source" value="{{ source }}">
      <input type="hidden" name="destination" value="{{ destination }}">
      <input type="hidden" name="name" value="{{ name }}">
      <input type="hidden" name="seat_no" value="{{ seat_no }}">
      <input type="hidden" name="amount" value="{{ amount }}">

      <label for="payment_method">Payment Method</label>
      <select name="payment_method" id="payment_method" required>
        <option value="" disabled selected>Select a method</option>
        <option value="card">Credit/Debit Card</option>
        <option value="upi">UPI</option>
      </select>

      <div id="card_details">
        <label for="card_number">Card Number</label>
        <input type="text" name="card_number" placeholder="1234 5678 9012 3456">

        <label for="expiry">Expiry Date</label>
        <input type="text" name="expiry" placeholder="MM/YY">

        <label for="cvv">CVV</label>
        <input type="password" name="cvv" placeholder="123">
      </div>

      <div id="upi_details" style="display:none;">
        <label for="upi_id">UPI ID</label>
        <input type="text" name="upi_id" placeholder="example@upi">
      </div>

      <button type="submit">💳 Confirm Payment</button>
    </form>
  </div>

  <script>
    const paymentMethod = document.getElementById('payment_method');
    const cardDetails = document.getElementById('card_details');
    const upiDetails = document.getElementById('upi_details');

    paymentMethod.addEventListener('change', function() {
      if (this.value === 'card') {
        cardDetails.style.display = 'block';
        upiDetails.style.display = 'none';
      } else if (this.value === 'upi') {
        upiDetails.style.display = 'block';
        cardDetails.style.display = 'none';
      } else {
        cardDetails.style.display = 'none';
        upiDetails.style.display = 'none';
      }
    });
  </script>
</body>
</html>
