<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <style>
    body {
      background: linear-gradient(to right, #dfc1d3, #d2a4b4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 3em;
      color: #333;
      margin-bottom: 40px;
    }

    table {
      width: 90%;
      margin: 0 auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #007BFF;
    }

    th, td {
      padding: 15px 20px;
      text-align: left;
      border: 1px solid #ddd;
    }

    th {
      background: #007BFF;
      color: #fff;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background: #f2f2f2;
    }

    tr:hover {
      background: #e0f0ff;
    }

    .actions {
      text-align: center;
      margin: 30px auto;
    }

    .actions a {
      background: #007BFF;
      color: #fff;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 50px;
      margin: 0 10px;
      transition: background 0.3s ease;
    }

    .actions a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>🗂️ Admin Dashboard</h1>

  <table>
    <thead>
      <tr>
        <th>Bus No</th>
        <th>Route</th>
        <th>Total Seats</th>
        <th>Booked Seats</th>
        <th>Waiting List</th>
      </tr>
    </thead>
    <tbody>
      {% for bus in buses %}
      <tr>
        <td>{{ bus.bus_no }}</td>
        <td>{{ bus.source.capitalize() }} → {{ bus.destination.capitalize() }}</td>
        <td>{{ bus.seats }}</td>
        <td>{{ bus.booked_seats|length }}</td>
        <td>{{ bus.waiting_list|join(", ") }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="actions">
    <a href="{{ url_for('export') }}">📄 Export as CSV</a>
    <a href="{{ url_for('logout') }}">🚪 Logout</a>
  </div>
</body>
</html>
